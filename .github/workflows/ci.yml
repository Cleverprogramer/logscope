name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (strict)
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun test

  binary:
    name: Compile standalone binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dist/logscope
        working-directory: packages/cli
        run: bun run compile

      - name: Smoke test binary
        working-directory: packages/cli
        run: ./dist/logscope stats ../../samples/sample.log > /dev/null

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: logscope-${{ runner.os }}
          path: packages/cli/dist/logscope
